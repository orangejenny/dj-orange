<li>
  {% csrf_token %}
  <input type="hidden" name="workout_id" value="{{ workout.id }}" />
  <span x-show="!editingWorkouts"
        x-on:click="editingWorkouts = true">
    <i role="button" class="{{ workout.activity_icon }}"></i>
    &nbsp;
    {{workout.activity}} {{ workout.summary }}
  </span>
  <div class="row g-1 mb-1 align-items-center" x-show="editingWorkouts">
    <div class="col-3">
      <select class="form-control" name="activity" data-add-choices="1">
        {# Be certain to show workout activity - if looking at an old workout, it might not be in all_activities #}
        {% if workout.activity %}
          <option selected>{{ workout.activity }}</option>
        {% endif %}
        {% for activity in all_activities %}
          {% if workout.activity != activity %}
            <option>{{ activity }}</option>
          {% endif %}
        {% endfor %}
      </select>
    </div>
    <div class="col-2">
      <input type="number" class="form-control" name="distance" placeholder="distance" value="{{ workout.distance|default:"" }}" />
    </div>
    <div class="col-2">
      <select class="form-control" name="distance_unit">
        {% for unit in all_distance_units %}
          <option{% if workout.distance_unit == unit %} selected{% endif %}>{{ unit }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-2">
      <input type="text" class="form-control" name="time" placeholder="time" value="{{ workout.time|default:"" }}" />
    </div>
    <div class="col-1">
      <div class="btn-group" role="group" x-show="editingWorkouts">
        <button type="button" class="float-end btn btn-outline-success btn-lg"
          hx-post="{% url "update_workout" %}"
          hx-include="closest li"
          hx-target="closest li">
          <i class="fa fa-check"></i>
        </button>
        <button type="button" class="btn btn-outline-danger btn-lg"
          x-on:click="workoutCount -= 1"
          hx-post="{% url "delete_workout" %}"
          hx-include="closest li"
          hx-target="closest li">
          <i class="fa fa-trash"></i>
        </button>
      </div>
    </div>
    <div class="col-2">{{ workout.pace|default:"" }}</div>
  </div>
  <div class="row g-1 mb-1" x-show="editingWorkouts">
     <div class="col-3"></div>
     <div class="col-2">
       <input type="number" class="form-control" name="sets" placeholder="sets"
              value="{{ workout.sets|default:"" }}" />
     </div>
     <div class="col-2">
       <input type="number" class="form-control" name="reps" placeholder="reps"
              value="{{ workout.reps|default:"" }}" />
     </div>
     <div class="col-2">
       <input type="text" class="form-control" name="weight" placeholder="weight"
              value="{{ workout.weight|default:"" }}" />
     </div>
  </div>
</li>
